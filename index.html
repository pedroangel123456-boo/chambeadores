<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Descargar Chambeadores App</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #f0f2f5;
            margin: 0;
            color: #333;
        }
        .container {
            background: white;
            padding: 2.5rem;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 90%;
            width: 350px;
        }
        h1 { margin-top: 0; font-size: 1.5rem; color: #2c3e50; }
        p { color: #666; margin-bottom: 25px; line-height: 1.5; }
        .qr-box {
            border: 2px solid #e9ecef;
            padding: 10px;
            border-radius: 10px;
            display: inline-block;
            margin-bottom: 20px;
            background: #fff;
        }
        img { display: block; width: 200px; height: 200px; }
        .btn {
            display: block;
            width: 100%;
            padding: 12px 0;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            transition: background-color 0.3s;
            box-sizing: border-box; /* Para que el padding no rompa el ancho */
        }
        .btn:hover { background-color: #0056b3; }
        .footer { margin-top: 20px; font-size: 0.8rem; color: #999; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Descarga Chambeadores</h1>
        <p>Escanea este código con tu celular para descargar e instalar la aplicación.</p>
        
        <div class="qr-box">
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=https://github.com/pedroangel123456-boo/chambeadores/releases/download/v1/app-debug.apk" alt="QR de Descarga">
        </div>
        
        <a href="https://github.com/pedroangel123456-boo/chambeadores/releases/download/v1/app-debug.apk" class="btn">Descargar APK Directamente</a>
        
        <div class="footer">Versión de prueba (Debug)</div>
    </div>

</body>
</html>
